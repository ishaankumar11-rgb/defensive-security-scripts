name: Python CI

on: [push]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python files ka syntax check karo
        run: |
          python -m py_compile *.py

      - name: Security scan karo (bandit)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -ll
